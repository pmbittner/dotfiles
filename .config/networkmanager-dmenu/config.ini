[dmenu]
# Use rofi in dmenu mode and show a prompt.
dmenu_command = rofi
rofi_highlight = True
# Signal strength is shown with these characters; saved networks are listed too.
wifi_chars = ▂▄▆█
list_saved = True

[dmenu_passphrase]
obscure = True

[editor]
# "Edit Connections" in the menu opens this GTK editor to add/edit/delete networks.
gui_if_available = True
terminal = kitty
