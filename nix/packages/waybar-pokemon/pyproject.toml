[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "waybar-pokemon"
version = "0.1.0"
description = "Little Pokémon walking around in a waybar module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow"]

[project.scripts]
waybar-pokemon = "waybar_pokemon.cli:main"

[tool.setuptools]
packages = ["waybar_pokemon"]
