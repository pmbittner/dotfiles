[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[project]
name = "waybar-pokemon"
version = "0.1.0"
description = "Little Pokémon walking around in a waybar module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow"]

[project.scripts]
waybar-pokemon = "waybar_pokemon.cli:main"
